name: kootu
description: Kootu — hyperlocal social shopping for Indian families.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4
  firebase_storage: ^12.1.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  geolocator: ^12.0.0
  shared_preferences: ^2.3.0
  http: ^1.2.2
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
